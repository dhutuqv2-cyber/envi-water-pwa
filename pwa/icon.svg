<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#238636" stroke-width="4" stroke-opacity="0.6" />

  <!-- Water Drop with Glow -->
  <g filter="url(#glow)">
    <path d="M256 95 C256 95 365 240 365 305 A109 109 0 0 1 147 305 C147 240 256 95 256 95 Z" fill="url(#dropGrad)" stroke="#3fb950" stroke-width="6" />
  </g>

  <!-- Ripples inside droplet -->
  <path d="M195 295 Q256 265 317 295" fill="none" stroke="#a8ffbe" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M215 335 Q256 315 297 335" fill="none" stroke="#a8ffbe" stroke-width="8" stroke-linecap="round" opacity="0.7" />

  <!-- Brand Typography -->
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="58" fill="#3fb950" letter-spacing="4">ENVI</text>
  <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#8b949e" letter-spacing="6">WATER STATION</text>
</svg>
